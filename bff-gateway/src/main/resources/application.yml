logging:
  file:
    name: logs/bff-gateway.log

server:
  port: 8080

spring:
  application:
    name: bff-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
